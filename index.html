<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy birthday Malokah</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
    /* General Layout */
    * { 
        margin: 0; 
        padding: 0; 
        box-sizing: border-box; 
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
    }

    body { 
        background: linear-gradient(135deg, #ffcee6 0%, #ffd6f1 50%, #e4f9ff 100%); 
        height: 100vh; 
        height: -webkit-fill-available;
        min-height: 100vh;
        min-height: -webkit-fill-available;
        overflow: hidden; 
        display: flex; 
        flex-direction: column; 
        justify-content: center; 
        align-items: center; 
        position: relative; 
        font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
    }

    /* The Glass Box Container */
    .container { 
        text-align: center; 
        z-index: 10; 
        padding: 2rem; 
        max-width: 800px; 
        width: 90%;
        background-color: rgba(255, 255, 255, 0.25); 
        border-radius: 24px; 
        backdrop-filter: blur(12px); 
        -webkit-backdrop-filter: blur(12px);
        box-shadow: 0 8px 32px rgba(255, 105, 180, 0.25), 
                    inset 0 1px 0 rgba(255, 255, 255, 0.4); 
        transition: all 0.5s ease; 
        border: 1px solid rgba(255, 255, 255, 0.3);
    }

    /* Text and Animations */
    h1 { 
        font-family: 'Pacifico', 'Brush Script MT', cursive;
        font-size: clamp(2.2rem, 8vw, 3.8rem); 
        color: #FF1493; 
        text-shadow: 2px 2px 8px rgba(255, 255, 255, 0.9),
                     0 0 20px rgba(255, 20, 147, 0.3); 
        margin-bottom: 1.5rem; 
        opacity: 0; 
        animation: bounce-in 1.5s forwards 0.5s; 
        line-height: 1.3;
        letter-spacing: 0.5px;
    }

    .subtitle { 
        font-family: 'Quicksand', 'Poppins', sans-serif;
        font-size: clamp(1.1rem, 4vw, 1.6rem); 
        font-weight: 600;
        color: #8A2BE2; 
        margin-bottom: 2rem; 
        text-shadow: 1px 1px 4px rgba(255, 255, 255, 0.8); 
        opacity: 0; 
        line-height: 1.5;
    }

    .next-button { 
        padding: 1rem 2.5rem; 
        font-size: clamp(1.1rem, 3.5vw, 1.4rem); 
        font-family: 'Quicksand', 'Poppins', sans-serif;
        font-weight: 700;
        background: linear-gradient(45deg, #FF1493, #8A2BE2); 
        color: white; 
        border: none; 
        border-radius: 50px; 
        cursor: pointer; 
        box-shadow: 0 4px 15px rgba(255, 20, 147, 0.5),
                    0 0 0 3px rgba(255, 255, 255, 0.2); 
        transition: all 0.3s ease; 
        opacity: 0; 
        animation: fade-in 1s forwards 3s; 
        -webkit-appearance: none;
        appearance: none;
        letter-spacing: 0.5px;
    }

    .next-button:hover, .next-button:active {
        transform: scale(1.05);
        box-shadow: 0 6px 25px rgba(255, 20, 147, 0.7),
                    0 0 0 3px rgba(255, 255, 255, 0.3);
    }

    .next-button:active {
        transform: scale(0.98);
    }

    /* Typewriter & Floating elements */
    .typewriter-container { 
        display: inline-block; 
        position: relative; 
        overflow: hidden; 
        height: auto;
        min-height: 2.5rem; 
    }
    .typewriter-text { 
        white-space: nowrap; 
        overflow: hidden; 
        width: 0; 
        animation: typewriter 3s steps(50) forwards 1.5s; 
    }
    .cursor { 
        position: absolute; 
        right: -5px; 
        width: 3px; 
        height: 100%; 
        background-color: #8A2BE2; 
        animation: blink 0.8s infinite; 
    }

    @keyframes bounce-in { 
        0% { transform: scale(0); opacity: 0; } 
        60% { transform: scale(1.1); opacity: 1; } 
        100% { transform: scale(1); opacity: 1; } 
    }
    @keyframes fade-in { 
        0% { opacity: 0; transform: translateY(20px); } 
        100% { opacity: 1; transform: translateY(0); } 
    }
    @keyframes typewriter { from { width: 0; } to { width: 100%; } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    /* Audio Controls */
    .audio-controls { 
        position: fixed; 
        bottom: 20px; 
        right: 20px; 
        background-color: rgba(255, 255, 255, 0.8); 
        padding: 10px 16px; 
        border-radius: 50px; 
        display: flex; 
        align-items: center; 
        z-index: 100; 
        box-shadow: 0 2px 15px rgba(0, 0, 0, 0.15),
                    0 0 0 1px rgba(255, 255, 255, 0.5); 
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
    }
    .audio-controls button { 
        background: none; 
        border: none; 
        font-size: 1.5rem; 
        cursor: pointer; 
        color: #FF1493; 
        margin-right: 10px; 
        padding: 4px;
        -webkit-appearance: none;
        appearance: none;
    }
    .audio-controls input { 
        width: 80px; 
        -webkit-appearance: none;
        appearance: none;
        height: 4px;
        border-radius: 2px;
        background: linear-gradient(to right, #FF1493, #8A2BE2);
        outline: none;
    }
    .audio-controls input::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #FF1493;
        cursor: pointer;
        box-shadow: 0 2px 6px rgba(255, 20, 147, 0.4);
    }

    /* Corner Photos */
    .corner-photo-container {
        position: fixed;
        top: 20px;
        z-index: 9999;
    }
    .right { right: 20px; }
    .left { left: 20px; }

    .styled-corner-photo {
        width: clamp(60px, 15vw, 80px);
        height: clamp(60px, 15vw, 80px);
        object-fit: cover;
        border-radius: 50%;
        border: 3px solid #ffffff;
        box-shadow: 0 0 15px rgba(255, 20, 147, 0.5),
                    0 4px 10px rgba(0, 0, 0, 0.1);
        transition: all 0.3s ease;
        cursor: pointer;
        -webkit-user-select: none;
        user-select: none;
    }

    .styled-corner-photo:hover, .styled-corner-photo:active {
        transform: scale(1.15);
        box-shadow: 0 0 25px rgba(255, 20, 147, 0.8),
                    0 6px 15px rgba(0, 0, 0, 0.15);
    }

    /* Start Music Overlay */
    .music-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        height: -webkit-fill-available;
        background: rgba(255, 206, 230, 0.9);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 10000;
        transition: opacity 0.6s ease, visibility 0.6s ease;
        padding: 2rem;
    }

    .music-overlay.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
    }

    .music-overlay h2 {
        font-family: 'Pacifico', 'Brush Script MT', cursive;
        font-size: clamp(1.8rem, 7vw, 2.8rem); 
        color: #FF1493;
        text-shadow: 2px 2px 8px rgba(255, 255, 255, 0.9);
        margin-bottom: 1rem;
        animation: heartbeat 1.5s ease-in-out infinite;
        text-align: center;
        line-height: 1.3;
    }

    .music-overlay p {
        font-family: 'Quicksand', 'Poppins', sans-serif;
        font-size: clamp(1rem, 3.5vw, 1.2rem); 
        color: #8A2BE2;
        margin-bottom: 2rem;
        text-align: center;
        font-weight: 500;
        max-width: 400px;
        line-height: 1.5;
    }

    .start-music-btn {
        padding: 1rem 2.5rem; 
        font-size: clamp(1.1rem, 3.5vw, 1.4rem); 
        font-family: 'Quicksand', 'Poppins', sans-serif;
        font-weight: 700;
        background: linear-gradient(45deg, #FF1493, #8A2BE2); 
        color: white; 
        border: none; 
        border-radius: 50px; 
        cursor: pointer; 
        box-shadow: 0 4px 20px rgba(255, 20, 147, 0.6),
                    0 0 0 3px rgba(255, 255, 255, 0.2);
        transition: all 0.3s ease; 
        animation: pulse 2s infinite;
        -webkit-appearance: none;
        appearance: none;
        letter-spacing: 0.5px;
    }

    .start-music-btn:hover, .start-music-btn:active {
        transform: scale(1.1);
        box-shadow: 0 6px 30px rgba(255, 20, 147, 0.8),
                    0 0 0 3px rgba(255, 255, 255, 0.3);
    }

    .start-music-btn:active {
        transform: scale(0.98);
    }

    @keyframes heartbeat {
        0% { transform: scale(1); }
        25% { transform: scale(1.05); }
        50% { transform: scale(1); }
        75% { transform: scale(1.05); }
        100% { transform: scale(1); }
    }

    @keyframes pulse {
        0% { transform: scale(1); box-shadow: 0 4px 20px rgba(255, 110, 196, 0.5); }
        50% { transform: scale(1.05); box-shadow: 0 8px 30px rgba(255, 110, 196, 0.7); }
        100% { transform: scale(1); box-shadow: 0 4px 20px rgba(255, 110, 196, 0.5); }
    }

    /* iOS Safe Area Support */
    @supports (padding-top: env(safe-area-inset-top)) {
        .corner-photo-container {
            top: max(20px, env(safe-area-inset-top));
        }
        .audio-controls {
            bottom: max(20px, env(safe-area-inset-bottom));
            right: max(20px, env(safe-area-inset-right));
        }
    }
    </style>

<base target="_blank">
</head>
<body>
    <!-- Music Start Overlay -->
    <div class="music-overlay" id="musicOverlay">
        <h2>🎵 Tap to Start the Music!</h2>
        <p>Click the button below to begin your birthday experience</p>
        <button class="start-music-btn" id="startMusicBtn">🎶 Start Music</button>
    </div>

    <div class="container">
        <h1>Happy Birthday, <br>Maloka <br>😛</h1>
        <div class="typewriter-container">
            <div class="subtitle typewriter-text">
                Hello baby i hope you find this pretty
                <span class="cursor"></span>
            </div>
        </div>
        <button class="next-button" onclick="goToNextPage()">can u mayhaps click me</button>
    </div>

    <div class="audio-controls">
        <button id="play-pause"><i>⏸️</i></button>
        <input type="range" id="volume" min="0" max="1" step="0.1" value="0.5">
    </div>

    <audio id="birthday-song" loop>
        <source src="song.mp3.mp3" type="audio/mp3">
    </audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>
    <script>
        const audio = document.getElementById('birthday-song');
        const playPauseBtn = document.getElementById('play-pause');
        const volumeControl = document.getElementById('volume');
        const musicOverlay = document.getElementById('musicOverlay');
        const startMusicBtn = document.getElementById('startMusicBtn');

        // Restore audio state from previous page (if coming back)
        function restoreAudioState() {
            const savedTime = localStorage.getItem('audioTime');
            const savedPaused = localStorage.getItem('audioPaused');
            const savedVolume = localStorage.getItem('audioVolume');

            if (savedVolume !== null) {
                audio.volume = parseFloat(savedVolume);
                volumeControl.value = parseFloat(savedVolume);
            }

            if (savedTime !== null) {
                audio.currentTime = parseFloat(savedTime);
            }

            if (savedPaused === 'false') {
                audio.play().then(() => {
                    musicOverlay.classList.add('hidden');
                    playPauseBtn.innerHTML = '<i>⏸️</i>';
                }).catch(() => {
                    playPauseBtn.innerHTML = '<i>▶️</i>';
                });
            } else {
                playPauseBtn.innerHTML = '<i>▶️</i>';
            }
        }

        function attemptAutoplay() {
            const playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    musicOverlay.classList.add('hidden');
                    playPauseBtn.innerHTML = '<i>⏸️</i>';
                }).catch(() => {
                    playPauseBtn.innerHTML = '<i>▶️</i>';
                });
            }
        }

        startMusicBtn.addEventListener('click', () => {
            audio.play().then(() => {
                musicOverlay.classList.add('hidden');
                playPauseBtn.innerHTML = '<i>⏸️</i>';
            }).catch(err => {
                console.log('Playback failed:', err);
            });
        });

        musicOverlay.addEventListener('click', (e) => {
            if (e.target === musicOverlay) {
                audio.play().then(() => {
                    musicOverlay.classList.add('hidden');
                    playPauseBtn.innerHTML = '<i>⏸️</i>';
                });
            }
        });

        window.addEventListener('load', () => {
            restoreAudioState();
            if (localStorage.getItem('audioTime') === null) {
                attemptAutoplay();
            }
        });

        function goToNextPage() {
            localStorage.setItem('audioTime', audio.currentTime);
            localStorage.setItem('audioPaused', audio.paused);
            localStorage.setItem('audioVolume', audio.volume);

            gsap.to('.next-button', {
                scale: 1.2, yoyo: true, repeat: 1, duration: 0.3,
                onComplete: () => { window.location.href = "memorylane.html"; }
            });
        }

        playPauseBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                playPauseBtn.innerHTML = '<i>⏸️</i>';
            } else {
                audio.pause();
                playPauseBtn.innerHTML = '<i>▶️</i>';
            }
        });

        volumeControl.addEventListener('input', () => { audio.volume = volumeControl.value; });

        function createFloatingElements() {
            const elements = ['🎈', '❤️', '✨', '🌸'];
            for (let i = 0; i < 30; i++) {
                const el = document.createElement('div');
                el.innerHTML = elements[Math.floor(Math.random() * elements.length)];
                el.style.position = 'absolute';
                el.style.left = Math.random() * 100 + 'vw';
                el.style.top = '-50px';
                el.style.fontSize = (Math.random() * 20 + 20) + 'px';
                document.body.appendChild(el);
                gsap.to(el, {
                    y: window.innerHeight + 100,
                    x: '+=' + (Math.random() * 100 - 50),
                    duration: Math.random() * 5 + 5,
                    onComplete: () => el.remove()
                });
            }
        }
        window.addEventListener('load', () => {
            createFloatingElements();
            setInterval(createFloatingElements, 5000);
        });
    </script>

    <div class="corner-photo-container right">
        <img src="talakkuma.jpg" alt="Birthday Princess" class="styled-corner-photo">
    </div>

    <div class="corner-photo-container left">
        <img src="talakuuwud.jpg" alt="malak 2" class="styled-corner-photo">
    </div>
</body>
</html>
